services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: langgraph_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_URI: postgresql://postgres:123456@db:5432/langgraph_db
      DATABASE_URL: postgresql+asyncpg://postgres:123456@db:5432/langgraph_db
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: doubao-seed-2-1-pro-260915
      LLM_BASE_URL: https://ark.cn-beijing.volces.com/api/v3
      JWT_SECRET: 32F34FDSVWAEF23F
    ports:
      - "8000:8000"

volumes:
  pgdata:
